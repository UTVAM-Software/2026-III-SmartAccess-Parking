{% extends "base.html" %}

{% block title %}Iniciar sesión · SmartAccess Parking{% endblock %}

{% block content %}
<section class="mx-auto auth-card">
    <div class="app-card p-4 p-md-5">
        <h1 class="page-title mb-4">Iniciar sesión</h1>
        <form method="post" class="django-form">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            {{ form.as_p }}
            <button class="btn btn-primary rounded-pill px-4" type="submit">Entrar</button>
        </form>
        <p class="text-secondary mt-4 mb-0">
            ¿Aún no tienes cuenta?
            <a href="{% url 'usuarios:registro_publico' %}">Regístrate aquí</a>.
        </p>
    </div>
</section>
{% endblock %}
