{% extends "base.html" %}

{% block title %}Eliminar {{ title }}{% endblock %}

{% block content %}
<section class="mx-auto confirm-card">
    <div class="app-card p-4 p-md-5">
        <div class="d-flex align-items-start gap-3">
            <div class="confirmation-icon rounded-circle bg-danger-subtle text-danger d-grid flex-shrink-0" aria-hidden="true">!</div>
            <div>
                <h2 class="page-title mb-3">Eliminar {{ title }}</h2>
                <p class="text-secondary mb-0">¿Confirmas que deseas eliminar “{{ object }}”?</p>
            </div>
        </div>

        <form class="border-top pt-4 mt-4" method="post">
            {% csrf_token %}
            <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-danger rounded-pill px-4" type="submit">Confirmar eliminación</button>
                <a class="btn btn-light rounded-pill px-4" href="{{ view.success_url }}">Cancelar</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
